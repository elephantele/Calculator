<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">

    <div id="display">0</div>

    <!-- EXACT 3 rows of 4 scientific buttons -->
    <div class="sci-buttons">
        <button class="btn dark" onclick="pressFunc('sqrt')">√</button>
        <button class="btn dark" onclick="pressFunc('sin')">sin</button>
        <button class="btn dark" onclick="pressFunc('cos')">cos</button>
        <button class="btn dark" onclick="pressFunc('tan')">tan</button>

        <button class="btn dark" onclick="pressFunc('log')">log</button>
        <button class="btn dark" onclick="pressFunc('ln')">ln</button>
        <button class="btn dark" onclick="pressConst('pi')">π</button>
        <button class="btn dark" onclick="pressConst('e')">e</button>

        <button class="btn dark" onclick="pressPower2()">x²</button>
        <button class="btn dark" onclick="toggleMode()">Mode</button>
        <button class="btn dark" onclick="pressParen()">( )</button>
        <button class="btn dark" onclick="backspace()">⌫</button>
    </div>

    <!-- Main buttons -->
    <div class="buttons">
        <button class="btn gray" onclick="clearDisplay()">AC</button>
        <button class="btn gray" onclick="toggleSign()">±</button>
        <button class="btn gray" onclick="percent()">%</button>
        <button class="btn orange" onclick="press('/')">÷</button>

        <button class="btn dark" onclick="press('7')">7</button>
        <button class="btn dark" onclick="press('8')">8</button>
        <button class="btn dark" onclick="press('9')">9</button>
        <button class="btn orange" onclick="press('*')">×</button>

        <button class="btn dark" onclick="press('4')">4</button>
        <button class="btn dark" onclick="press('5')">5</button>
        <button class="btn dark" onclick="press('6')">6</button>
        <button class="btn orange" onclick="press('-')">−</button>

        <button class="btn dark" onclick="press('1')">1</button>
        <button class="btn dark" onclick="press('2')">2</button>
        <button class="btn dark" onclick="press('3')">3</button>
        <button class="btn orange" onclick="press('+')">+</button>

        <button class="btn dark zero" onclick="press('0')">0</button>
        <button class="btn dark" onclick="press('.')">.</button>
        <button class="btn orange" onclick="calculate()">=</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
