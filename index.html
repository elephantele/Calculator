<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">

    <div id="display">0</div>

    <div class="sci-buttons">

        <button onclick="press('(')">(</button>
        <button onclick="press(')')">)</button>
        <button onclick="press('!')">x!</button>
        <button onclick="press('^')">xʸ</button>
        <button onclick="press('mod')">mod</button>

        <button onclick="press('sin(')">sin</button>
        <button onclick="press('cos(')">cos</button>
        <button onclick="press('tan(')">tan</button>
        <button onclick="press('asin(')">sin⁻¹</button>
        <button onclick="press('acos(')">cos⁻¹</button>

        <button onclick="press('atan(')">tan⁻¹</button>
        <button onclick="press('log(')">log</button>
        <button onclick="press('ln(')">ln</button>
        <button onclick="press('sqrt(')">√</button>
        <button onclick="press('cbrt(')">³√</button>

        <button onclick="press('pi')">π</button>
        <button onclick="press('e')">e</button>
        <button onclick="press('^2')">x²</button>
        <button onclick="press('^3')">x³</button>
        <button onclick="press('EE')">EE</button>

        <button onclick="memoryClear()">MC</button>
        <button onclick="memoryRecall()">MR</button>
        <button onclick="memoryAdd()">M+</button>
        <button onclick="memorySubtract()">M−</button>

    </div>

    <div class="buttons">

        <button class="btn gray" onclick="clearDisplay()">AC</button>
        <button class="btn gray" onclick="toggleSign()">±</button>
        <button class="btn gray" onclick="percent()">%</button>
        <button class="btn orange" onclick="press('/')">÷</button>

        <button class="btn dark" onclick="press('7')">7</button>
        <button class="btn dark" onclick="press('8')">8</button>
        <button class="btn dark" onclick="press('9')">9</button>
        <button class="btn orange" onclick="press('*')">×</button>

        <button class="btn dark" onclick="press('4')">4</button>
        <button class="btn dark" onclick="press('5')">5</button>
        <button class="btn dark" onclick="press('6')">6</button>
        <button class="btn orange" onclick="press('-')">−</button>

        <button class="btn dark" onclick="press('1')">1</button>
        <button class="btn dark" onclick="press('2')">2</button>
        <button class="btn dark" onclick="press('3')">3</button>
        <button class="btn orange" onclick="press('+')">+</button>

        <button class="btn dark zero" onclick="press('0')">0</button>
        <button class="btn dark" onclick="press('.')">.</button>
        <button class="btn orange" onclick="calculate()">=</button>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
